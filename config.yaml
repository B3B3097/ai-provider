environment: development
debug: true
default_model: gpt-4o-mini
fallback_models:
- gpt-4o
- claude-3-5-haiku
load_balancer: latency_aware
model_routing:
  gpt-*:
  - openai
  - azure
  claude-*:
  - anthropic
  gemini-*:
  - google
gateway:
  bind_host: 127.0.0.1
  bind_port: 8080
  workers: 1
  api_keys:
    - "${GATEWAY_API_KEY:-local-client-key}"
  admin_keys:
    - "${ADMIN_API_KEY:-local-admin-key}"
  cors_origins:
    - http://127.0.0.1
    - http://localhost
  rate_limit:
    rpm: 1000
    tpm: 500000
  public_api:
    enabled: true
    store_type: memory
    redis_prefix: public_api
    key_prefix: sk-live
    default_rpm: 60
    default_rpd: 10000
    default_token_limit: 1000000
    default_ttl_days: 0
    issuer_name: Unified LLM Gateway
  request_timeout: 300
  log_level: INFO
  enable_metrics: true
  docs_enabled: true
storage:
  type: file
  file:
    path: ./tokens/tokens.json
providers:
- name: openai
  display_name: OpenAI
  base_url: https://api.openai.com
  enabled: true
  auth:
    type: bearer
    header_name: Authorization
    prefix: 'Bearer '
  rate_limit:
    rpm: 3000
    tpm: 1000000
  retry:
    max_attempts: 3
    retry_on:
    - 429
    - 500
    - 502
    - 503
    - 504
  health_check:
    enabled: true
    interval: 30
    endpoint: /v1/models
  models:
  - id: gpt-4o-mini
    provider_model: gpt-4o-mini
    max_tokens: 16384
    context_window: 128000
    supports_vision: true
    tags:
    - cheap
    - vision
  - id: gpt-4o
    provider_model: gpt-4o
    max_tokens: 16384
    context_window: 128000
    supports_vision: true
    tags:
    - flagship
    - vision
- name: anthropic
  display_name: Anthropic
  base_url: https://api.anthropic.com
  enabled: true
  auth:
    type: api_key
    header_name: x-api-key
    prefix: ''
  rate_limit:
    rpm: 1000
    tpm: 500000
  health_check:
    enabled: true
    interval: 30
    endpoint: /v1/models
  models:
  - id: claude-3-5-haiku
    provider_model: claude-3-5-haiku-20241022
    max_tokens: 8192
    context_window: 200000
    supports_vision: true
    tags:
    - cheap
    - fast
  - id: claude-3-5-sonnet
    provider_model: claude-3-5-sonnet-20241022
    max_tokens: 8192
    context_window: 200000
    supports_vision: true
    tags:
    - flagship
    - vision
- name: google
  display_name: Google AI
  base_url: https://generativelanguage.googleapis.com
  enabled: true
  auth:
    type: query_param
    query_param: key
  rate_limit:
    rpm: 1500
    tpm: 1000000
  health_check:
    enabled: true
    interval: 60
    endpoint: /v1beta/models
  models:
  - id: gemini-1.5-flash
    provider_model: gemini-1.5-flash
    max_tokens: 8192
    context_window: 1000000
    supports_vision: true
    tags:
    - cheap
    - fast
  - id: gemini-1.5-pro
    provider_model: gemini-1.5-pro
    max_tokens: 8192
    context_window: 2000000
    supports_vision: true
    tags:
    - flagship
    - long-context
- name: custom
  display_name: OpenAI-compatible local provider
  base_url: ${CUSTOM_PROVIDER_URL:-http://localhost:11434}
  enabled: false
  auth:
    type: none
  rate_limit:
    rpm: 10000
    tpm: 5000000
  health_check:
    enabled: true
    interval: 15
    endpoint: /v1/models
  custom_endpoints:
    chat: /v1/chat/completions
    models: /v1/models
  models: []
token_factories:
  openai:
    enabled: true
    provider: openai
    sources:
    - env
    - file
    env_prefix: OPENAI_TOKEN_
    file_path: ./tokens/openai.txt
  anthropic:
    enabled: true
    provider: anthropic
    sources:
    - env
    - file
    env_prefix: ANTHROPIC_TOKEN_
    file_path: ./tokens/anthropic.txt
  google:
    enabled: true
    provider: google
    sources:
    - env
    - file
    env_prefix: GOOGLE_TOKEN_
    file_path: ./tokens/google.txt
