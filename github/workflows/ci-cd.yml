# language: YAML, file: .github/workflows/ci-cd.yml
# *Полный цикл CI/CD: тесты, сборка Docker, авто-обновление README с ключом*

name: AI Provider CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Ручной запуск для принудительного обновления ключа

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}

jobs:
  # 1. Проверка зависимостей и тесты
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Validate configuration
        run: |
          python -m token_abuse_engine.main init-config config.yaml --force
          python -m token_abuse_engine.main validate config.yaml

      - name: Run tests
        run: |
          python -m pytest -q

  # 2. Сборка и публикация Docker-образа в GHCR
  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ADMIN_API_KEY=${{ env.ADMIN_API_KEY }}

  # 3. Авто-генерация ключа и обновление README.md
  update-readme:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write # Требуется для коммита обновленного README
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Create data directories
        run: |
          mkdir -p data/incoming
          touch data/incoming/openai.txt
          touch data/incoming/anthropic.txt

      - name: Run bootstrap script to generate key and update README
        env:
          ADMIN_API_KEY: ${{ env.ADMIN_API_KEY }}
        run: |
          # Запускаем шлюз в фоне, генерируем ключ и обновляем README
          python -m token_abuse_engine.main serve config.yaml &
          GATEWAY_PID=$!
          sleep 5 # Ожидание запуска шлюза
          
          # Генерация ключа через API
          RESPONSE=$(curl -s -X POST "http://127.0.0.1:8080/admin/api-keys" \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name": "github-auto-generated", "rpm_limit": 120, "rpd_limit": 50000, "token_limit": 0, "ttl_days": 365}')
          
          RAW_KEY=$(echo $RESPONSE | python -c "import sys, json; print(json.load(sys.stdin).get('raw_key', ''))")
          
          if [ -z "$RAW_KEY" ]; then
            echo "Failed to generate key. Response: $RESPONSE"
            exit 1
          fi

          echo "Generated key: $RAW_KEY"

          # Формирование блока для README
          CONTINUE_CONFIG=$(cat <<EOF
          {
            "models": [
              {
                "title": "Unified Gateway (GPT-4o)",
                "provider": "openai",
                "model": "gpt-4o",
                "apiKey": "$RAW_KEY",
                "apiBase": "https://${{ github.repository_owner }}.github.io/v1" 
              }
            ],
            "tabAutocompleteModel": {
              "title": "Fast Autocomplete",
              "provider": "openai",
              "model": "gpt-4o-mini",
              "apiKey": "$RAW_KEY",
              "apiBase": "https://${{ github.repository_owner }}.github.io/v1"
            }
          }
          EOF
          )

          # Внедрение в README.md
          python3 << 'PYTHON_SCRIPT'
          import re
          import os
          
          raw_key = os.environ.get('RAW_KEY')
          continue_config = os.environ.get('CONTINUE_CONFIG')
          
          injection_block = f"""
  <!-- AUTO_GENERATED_CONFIG_START -->
  ## 🚀 Подключение Continue (VS Code)

  Публичный ключ шлюза:
  \`\`\`text
  {raw_key}
  \`\`\`

  Конфигурация для \`config.json\` в Continue:
  \`\`\`json
  {continue_config}
  \`\`\`
  <!-- AUTO_GENERATED_CONFIG_END -->
  """
          
          readme_path = "README.md"
          if not os.path.exists(readme_path):
              with open(readme_path, "w", encoding="utf-8") as f:
                  f.write("# Unified LLM Gateway\n\n")
                  
          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()
              
          pattern = re.compile(r"<!-- AUTO_GENERATED_CONFIG_START -->.*?<!-- AUTO_GENERATED_CONFIG_END -->", re.DOTALL)
          if pattern.search(content):
              new_content = pattern.sub(injection_block.strip(), content)
          else:
              new_content = content.rstrip() + "\n\n" + injection_block.strip() + "\n"
              
          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(new_content)
          PYTHON_SCRIPT

      - name: Commit and push updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update public API key in README [skip ci]" || echo "No changes to commit"
          git push