# language: YAML, file: config.production.yaml, runtime: token_abuse_engine
environment: production
debug: false
default_model: gpt-4o-mini
fallback_models:
  - gpt-4o
  - claude-3-5-haiku
  - gemini-1.5-flash
load_balancer: latency_aware
model_routing:
  gpt-*:
    - openai
  claude-*:
    - anthropic
  gemini-*:
    - google

gateway:
  bind_host: 0.0.0.0
  bind_port: 8080
  workers: 1
  api_keys:
    - "${GATEWAY_API_KEY:-}"
  admin_keys:
    - "${ADMIN_API_KEY:-}"
  cors_origins:
    - "https://b3b3097.github.io"
    - "${PUBLIC_ORIGIN:-https://localhost}"
  rate_limit:
    rpm: 1000
    tpm: 500000
    rpd: 10000
  public_api:
    enabled: true
    store_type: redis
    redis_url: "${REDIS_URL:-redis://redis:6379/0}"
    redis_prefix: public_api
    key_prefix: sk-live
    default_rpm: 60
    default_rpd: 10000
    default_token_limit: 1000000
    default_ttl_days: 0
    issuer_name: "${ISSUER_NAME:-Unified LLM Gateway}"
    support_url: "${SUPPORT_URL:-}"
    terms_url: "${TERMS_URL:-}"
    privacy_url: "${PRIVACY_URL:-}"
  request_timeout: 300
  log_level: "${LOG_LEVEL:-INFO}"
  enable_metrics: true
  docs_enabled: false

storage:
  type: redis
  redis:
    url: "${REDIS_URL:-redis://redis:6379/0}"
    prefix: token_engine

providers:
  - name: openai
    display_name: OpenAI
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com}"
    enabled: true
    auth:
      type: bearer
      header_name: Authorization
      prefix: 'Bearer '
    rate_limit:
      rpm: 3000
      tpm: 1000000
    retry:
      max_attempts: 3
      retry_on: [429, 500, 502, 503, 504]
    health_check:
      enabled: true
      interval: 30
      endpoint: /v1/models
    model_discovery: true
    discovery_interval: 3600
    models:
      - id: gpt-4o-mini
        provider_model: gpt-4o-mini
        aliases: [gpt-4o-mini-latest]
        max_tokens: 16384
        context_window: 128000
        supports_streaming: true
        supports_vision: true
        supports_functions: true
        pricing: {input: 0.15, output: 0.60}
        priority: 20
        tags: [cheap, vision]
      - id: gpt-4o
        provider_model: gpt-4o
        max_tokens: 16384
        context_window: 128000
        supports_streaming: true
        supports_vision: true
        supports_functions: true
        pricing: {input: 2.50, output: 10.00}
        priority: 10
        tags: [flagship, vision]

  - name: anthropic
    display_name: Anthropic
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    enabled: true
    auth:
      type: api_key
      header_name: x-api-key
      prefix: ''
    rate_limit:
      rpm: 1000
      tpm: 500000
    retry:
      max_attempts: 3
      retry_on: [429, 500, 502, 503, 504]
    health_check:
      enabled: true
      interval: 30
      endpoint: /v1/models
    model_discovery: true
    discovery_interval: 3600
    models:
      - id: claude-3-5-haiku
        provider_model: claude-3-5-haiku-20241022
        max_tokens: 8192
        context_window: 200000
        supports_streaming: true
        supports_vision: true
        pricing: {input: 0.80, output: 4.00}
        priority: 20
        tags: [cheap, fast]
      - id: claude-3-5-sonnet
        provider_model: claude-3-5-sonnet-20241022
        max_tokens: 8192
        context_window: 200000
        supports_streaming: true
        supports_vision: true
        supports_functions: true
        pricing: {input: 3.00, output: 15.00}
        priority: 10
        tags: [flagship, vision]

  - name: google
    display_name: Google AI
    base_url: "${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com}"
    enabled: true
    auth:
      type: query_param
      query_param: key
    rate_limit:
      rpm: 1500
      tpm: 1000000
    retry:
      max_attempts: 3
      retry_on: [429, 500, 502, 503, 504]
    health_check:
      enabled: true
      interval: 60
      endpoint: /v1beta/models
    model_discovery: true
    discovery_interval: 3600
    models:
      - id: gemini-1.5-flash
        provider_model: gemini-1.5-flash
        max_tokens: 8192
        context_window: 1000000
        supports_streaming: true
        supports_vision: true
        pricing: {input: 0.075, output: 0.30}
        priority: 20
        tags: [cheap, fast]
      - id: gemini-1.5-pro
        provider_model: gemini-1.5-pro
        max_tokens: 8192
        context_window: 2000000
        supports_streaming: true
        supports_vision: true
        supports_functions: true
        pricing: {input: 1.25, output: 5.00}
        priority: 10
        tags: [flagship, long-context]

  - name: custom
    display_name: OpenAI-compatible custom provider
    base_url: "${CUSTOM_PROVIDER_URL:-http://custom:8080/v1}"
    enabled: false
    auth:
      type: bearer
      prefix: 'Bearer '
    health_check:
      enabled: false
    custom_endpoints:
      chat: /chat/completions
      models: /models
    models: []

token_factories:
  openai:
    enabled: true
    provider: openai
    sources: [env]
    env_prefix: OPENAI_TOKEN_
  anthropic:
    enabled: true
    provider: anthropic
    sources: [env]
    env_prefix: ANTHROPIC_TOKEN_
  google:
    enabled: true
    provider: google
    sources: [env]
    env_prefix: GOOGLE_TOKEN_
