# language: YAML, file: .github/workflows/ci.yml, runtime: GitHub Actions
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[redis,dev]"
      - name: Compile
        run: python -m compileall -q token_abuse_engine tests
      - name: Lint
        run: python -m ruff check token_abuse_engine tests
      - name: Validate development config
        run: python -m token_abuse_engine.main validate config.yaml
      - name: Validate production config
        env:
          ADMIN_API_KEY: ci-admin
          GATEWAY_API_KEY: ci-client
        run: python -m token_abuse_engine.main validate config.production.yaml
      - name: Test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test panel encryption and issuance flow
        run: node --test tests/panel.test.mjs
      - name: Validate admin Compose manifest
        run: |
          export ADMIN_API_KEY="$(openssl rand -hex 32)"
          export GATEWAY_API_KEY="$(openssl rand -hex 32)"
          docker compose -f docker-compose.admin.yml config --quiet
      - name: Validate production Compose manifest
        run: docker compose config --quiet
      - name: Validate VS Code launch profile
        env:
          ADMIN_API_KEY: ci-admin
          GATEWAY_API_KEY: ci-client
        run: docker compose -f examples/vscode/run-token-engine.yaml config --quiet
      - name: Validate VS Code usage profile
        env:
          GATEWAY_API_KEY: ci-client
        run: docker compose -f examples/vscode/show-key-usage.yaml config --quiet
      - name: Build image
        run: docker build --tag unified-llm-gateway:ci .
      - name: Smoke test admin Compose
        run: |
          export ADMIN_API_KEY="$(openssl rand -hex 32)"
          export GATEWAY_API_KEY="$(openssl rand -hex 32)"
          trap 'docker compose -f docker-compose.admin.yml down --volumes' EXIT
          docker compose -f docker-compose.admin.yml up -d --build --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/models)" = 401
          curl --fail --silent http://127.0.0.1:8081/ | grep -q 'crypto\|app.mjs'
