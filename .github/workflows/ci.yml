# language: YAML, file: .github/workflows/ci.yml, runtime: GitHub Actions
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[redis,dev]"
      - name: Compile
        run: python -m compileall -q token_abuse_engine tests
      - name: Lint
        run: python -m ruff check token_abuse_engine tests
      - name: Validate development config
        run: python -m token_abuse_engine.main validate config.yaml
      - name: Validate production config
        env:
          ADMIN_API_KEY: ci-admin
          GATEWAY_API_KEY: ci-client
        run: python -m token_abuse_engine.main validate config.production.yaml
      - name: Test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose manifest
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag unified-llm-gateway:ci .
