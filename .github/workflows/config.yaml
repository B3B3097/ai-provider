# language: YAML, file: config.yaml
# *Полная конфигурация шлюза для автоматического подхвата и публичной выдачи*

admin_api_key: "${ADMIN_API_KEY:-admin-super-secret-key}"
client_api_key: "${CLIENT_API_KEY:-client-bootstrap-key}"

storage:
  type: file
  file:
    path: ./data/state.json

# Источники токенов: шлюз читает эти файлы и автоматически добавляет новые строки в пул
token_factories:
  openai:
    enabled: true
    provider: openai
    sources: [env, file]
    env_prefix: "OPENAI_TOKEN_"
    file_path: ./data/incoming/openai.txt
    poll_interval_seconds: 15 # Опрос файла каждые 15 секунд

  anthropic:
    enabled: true
    provider: anthropic
    sources: [file]
    file_path: ./data/incoming/anthropic.txt
    poll_interval_seconds: 15

routing:
  strategy: latency_aware
  retry_on_429: true
  retry_on_5xx: true
  retry_on_401: false # Мертвый токен, ретрай бесполезен
  cooldown_seconds: 60

public_api:
  enabled: true
  require_https: false
  store_type: memory # Или redis, если запущен Redis
  key_prefix: "sk-live"
  default_rpm: 60
  default_rpd: 10000
  default_token_limit: 0
  default_ttl_days: 365