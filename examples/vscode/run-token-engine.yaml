# language: YAML, file: examples/vscode/run-token-engine.yaml, runtime: Docker Compose v2
# Local VS Code gateway profile. Secrets come from the terminal environment.
name: unified-llm-gateway-local

services:
  gateway:
    build:
      context: ../..
    command:
      - python
      - -m
      - token_abuse_engine.main
      - serve
      - /app/config.production.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in the VS Code terminal}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in the VS Code terminal}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com}
      CUSTOM_PROVIDER_URL: ${CUSTOM_PROVIDER_URL:-http://host.docker.internal:11434}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - vscode-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gateway

networks:
  gateway:
    driver: bridge

volumes:
  vscode-redis-data:
